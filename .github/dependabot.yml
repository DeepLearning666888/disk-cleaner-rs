version: 2
updates:
  # GitHub Actions 固定到 commit SHA 后，由 Dependabot 定期更新 SHA。
  # cargo 生态暂不启用：Dependabot 的 cargo 更新会读取 rust-toolchain.toml，
  # 其中的 stable-x86_64-pc-windows-gnu 会被其 rustup 拒绝
  # （error: target tuple in channel name）。
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
