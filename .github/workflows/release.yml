name: Release

on:
  push:
    tags: ["v*"]
  # 手动演练：只构建、打包、出校验和、做来源证明，并上传为 Actions 产物；
  # 不创建 tag、不创建 Release，因此不会对外公开任何东西。
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  windows-gnu:
    name: build / checksum / attest (windows-gnu)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: stable-x86_64-pc-windows-gnu

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup MingW
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: UCRT64
          update: false
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Add MingW to PATH
        shell: pwsh
        run: |
          "C:\msys64\ucrt64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal
          rustc -vV

      - name: Build release
        run: cargo build --release --locked

      - name: Package and checksum
        shell: pwsh
        run: |
          $exe = "target\release\disk-app.exe"
          if (-not (Test-Path $exe)) { throw "未找到 $exe" }
          $refName = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME } else { "rehearsal-$env:GITHUB_RUN_NUMBER" }
          $zip = "disk-cleaner-rs-$refName-x86_64-pc-windows-gnu.zip"
          Compress-Archive -Path $exe -DestinationPath $zip -Force
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLower()
          "$hash  $zip" | Out-File -FilePath SHA256SUMS.txt -Encoding utf8
          Get-Content SHA256SUMS.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            disk-cleaner-rs-*.zip
            SHA256SUMS.txt

      - name: Upload rehearsal artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rehearsal-build
          path: |
            disk-cleaner-rs-*.zip
            SHA256SUMS.txt
          retention-days: 7

      - name: Create GitHub Release
        # 只有 tag 触发才发布；手动演练不创建 Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = (Get-ChildItem "disk-cleaner-rs-*.zip" | Select-Object -First 1).Name
          gh release create "$env:GITHUB_REF_NAME" "$zip" SHA256SUMS.txt --generate-notes
