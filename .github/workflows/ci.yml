name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: fmt / clippy / test (windows-gnu)
    runs-on: windows-latest
    env:
      # runner 上的新版 rustup 不接受 rust-toolchain.toml 里带目标三元组的 channel，
      # 用环境变量直接指定工具链，绕过该文件解析。
      RUSTUP_TOOLCHAIN: stable-x86_64-pc-windows-gnu
    steps:
      - uses: actions/checkout@v4

      - name: Setup MingW
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc

      - name: Add MingW to PATH
        shell: pwsh
        run: |
          "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal
          rustup component add rustfmt clippy
          rustup show active-toolchain
          rustc -vV

      - name: rustfmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        run: cargo test --workspace

  audit:
    name: cargo-audit (dependencies)
    runs-on: ubuntu-latest
    env:
      # 仓库的 rust-toolchain.toml 指向 Windows GNU 工具链，Linux runner 上改用默认 stable。
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v4

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Audit Cargo.lock
        run: cargo-audit audit
