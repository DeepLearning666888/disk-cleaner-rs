name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: fmt / clippy / test (windows-gnu)
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      # runner 上的新版 rustup 不接受 rust-toolchain.toml 里带目标三元组的 channel，
      # 用环境变量直接指定工具链，绕过该文件解析。
      RUSTUP_TOOLCHAIN: stable-x86_64-pc-windows-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup MingW
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: UCRT64
          update: false
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Add MingW to PATH
        shell: pwsh
        run: |
          "C:\msys64\ucrt64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal
          rustup component add rustfmt clippy
          rustup show active-toolchain
          rustc -vV

      - name: rustfmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: test
        run: cargo test --workspace --locked

  audit:
    name: cargo-audit (dependencies)
    # 固定到 24.04：GitHub 宣布 ubuntu-latest 将从 2026-10-19 起迁移到 Ubuntu 26，
    # 固定版本避免迁移带来的不确定变更。
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # 仓库的 rust-toolchain.toml 指向 Windows GNU 工具链，Linux runner 上改用默认 stable。
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install cargo-audit
        uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2
        with:
          tool: cargo-audit

      - name: 检查依赖来源（仅允许 crates.io）
        run: |
          bad=$(grep -E '^source = "' Cargo.lock | grep -v 'registry+https://github.com/rust-lang/crates.io-index' || true)
          if [ -n "$bad" ]; then
            echo "发现非 crates.io 的依赖来源："
            echo "$bad"
            exit 1
          fi
          echo "依赖来源检查通过"

      - name: Audit Cargo.lock
        run: cargo-audit audit
